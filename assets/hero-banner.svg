<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Hrishikesh Ithape - AI/ML Engineer and Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#17153b" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="78%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="20%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <pattern id="dotGrid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.45" />
    </pattern>

    <clipPath id="rounded">
      <rect x="0" y="0" width="1200" height="320" rx="18" ry="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <!-- Base Background -->
    <rect width="1200" height="320" fill="url(#bgGrad)" />
    <rect width="1200" height="320" fill="url(#dotGrid)" />
    <rect width="1200" height="320" fill="url(#glowCyan)" />
    <rect width="1200" height="320" fill="url(#glowPurple)" />

    <!-- Subtle Outer Border -->
    <rect x="1" y="1" width="1198" height="318" rx="17" ry="17" fill="none" stroke="#1e293b" stroke-width="2" />

    <!-- Decorative Neural / System Graph on Right -->
    <g transform="translate(830, 35)" opacity="0.9">
      <!-- Orbit Rings -->
      <circle cx="170" cy="125" r="105" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="5 6" />
      <circle cx="170" cy="125" r="68" fill="none" stroke="#334155" stroke-width="1.2" />

      <!-- Connections -->
      <line x1="85" y1="65" x2="170" y2="125" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" />
      <line x1="255" y1="70" x2="170" y2="125" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.45" />
      <line x1="95" y1="190" x2="170" y2="125" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.45" />
      <line x1="250" y1="185" x2="170" y2="125" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" />
      <line x1="85" y1="65" x2="255" y2="70" stroke="#475569" stroke-width="1" stroke-opacity="0.5" />
      <line x1="95" y1="190" x2="250" y2="185" stroke="#475569" stroke-width="1" stroke-opacity="0.5" />

      <!-- Outer Nodes -->
      <circle cx="85" cy="65" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="255" cy="70" r="6" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle cx="95" cy="190" r="6" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle cx="250" cy="185" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />

      <!-- Center Core Pulse -->
      <circle cx="170" cy="125" r="22" fill="#38bdf8" opacity="0.14">
        <animate attributeName="r" values="18;28;18" dur="3.6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.22;0.05;0.22" dur="3.6s" repeatCount="indefinite" />
      </circle>
      <circle cx="170" cy="125" r="11" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="170" cy="125" r="4" fill="#38bdf8" />
    </g>

    <!-- Status Pill -->
    <g transform="translate(64, 52)">
      <rect x="0" y="0" width="218" height="28" rx="14" fill="#0f172a" stroke="#22c55e" stroke-opacity="0.45" stroke-width="1.2" />
      <circle cx="18" cy="14" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <text x="30" y="18.5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#86efac" letter-spacing="0.8">OPEN TO COLLABORATION</text>
    </g>

    <!-- Main Name -->
    <text x="64" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#nameGrad)" letter-spacing="-0.8">
      Hrishikesh Ithape
    </text>

    <!-- Accent Underline -->
    <rect x="64" y="156" width="320" height="3" rx="1.5" fill="url(#lineGrad)" />

    <!-- Role Subtitle -->
    <text x="64" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#cbd5e1">
      AI/ML Engineer  <tspan fill="#38bdf8">•</tspan>  Full-Stack Developer  <tspan fill="#818cf8">•</tspan>  Trustworthy AI
    </text>

    <!-- Tagline -->
    <text x="64" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" fill="#94a3b8">
      Building practical systems where machine learning, security, and clean products meet.
    </text>

    <!-- Bottom Tech Pills -->
    <g transform="translate(64, 258)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600">
      <rect x="0" y="0" width="76" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="38" y="17" text-anchor="middle" fill="#38bdf8">Python</text>

      <rect x="86" y="0" width="84" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="128" y="17" text-anchor="middle" fill="#a78bfa">PyTorch</text>

      <rect x="180" y="0" width="102" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="231" y="17" text-anchor="middle" fill="#38bdf8">TypeScript</text>

      <rect x="292" y="0" width="72" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="328" y="17" text-anchor="middle" fill="#7dd3fc">React</text>

      <rect x="374" y="0" width="128" height="26" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="438" y="17" text-anchor="middle" fill="#86efac">Trustworthy AI</text>
    </g>
  </g>
</svg>
